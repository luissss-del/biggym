{% extends 'cuentas/base.html' %}
{% block title %}Dashboard - BigGym{% endblock %}
{% block content %}
    <h1>¡Bienvenido, {{ request.user.nombre_completo }}!</h1>
    <p class="subtitle">Documento: {{ request.user.documento }}</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
{% endblock %}
