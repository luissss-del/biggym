{% extends 'cuentas/base.html' %}
{% block title %}Editar ejercicio - BigGym{% endblock %}
{% block content %}

<div class="topbar">
    <a href="{% url 'detalle_dia' ejercicio.dia_entrenamiento.id %}" class="icon-btn">←</a>
</div>

<div class="card" style="margin-top:16px;">
    <div class="eyebrow">{{ ejercicio.dia_entrenamiento.get_dia_display }}</div>
    <h1 class="display" style="font-size:28px;">EDITAR EJERCICIO</h1>
    <div class="stripe"></div>

    <form method="post">
        {% csrf_token %}
        {{ form.nombre }}
        {{ form.repeticiones }}
        <label style="font-size:12px; color:var(--fog); font-family:'Space Mono',monospace; text-transform:uppercase; display:block; margin-bottom:6px;">Fase</label>
        {{ form.fase }}
        <button type="submit" class="btn">Guardar cambios</button>
        <a href="{% url 'detalle_dia' ejercicio.dia_entrenamiento.id %}" class="btn btn-ghost" style="margin-top:10px;">Cancelar</a>
    </form>
</div>
{% endblock %}
